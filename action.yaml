name: Scan code security advisories
description: Scan Haskell code for possible security advisories.

inputs:
  checkout_path:
    description: "The path at which the analyzed repository was checked out. Used to relativize any absolute paths in the uploaded SARIF file."
    required: false
    default: ${{ github.workspace }}
  ref:
    description: "The ref where results will be uploaded. If not provided, the Action will use the GITHUB_REF environment variable. If provided, the sha input must be provided as well. This input is ignored for pull requests from forks."
    required: false
  sha:
    description: "The sha of the HEAD of the ref where results will be uploaded. If not provided, the Action will use the GITHUB_SHA environment variable. If provided, the ref input must be provided as well. This input is ignored for pull requests from forks."
    required: false
  token:
    description: "GitHub token to use for authenticating with this instance of GitHub. The token needs the `security-events: write` permission."
    required: false
    default: ${{ github.token }}
  enrich-sarif:
    description: "Enrich cabal-audit SARIF with dependency paths from Cabal plan.json using cabal-plan-submit."
    required: false
    default: "true"

outputs:
  sarif-id:
    description: The ID of the uploaded SARIF file.
    value: ${{ steps.upload-sarif.outputs.sarif-id }}

runs:
  using: composite
  steps:
    - name: Extract
      shell: bash
      env:
        CHECKOUT_PATH: ${{ inputs.checkout_path }}
        ENRICH_SARIF: ${{ inputs.enrich-sarif }}
      run: |
        set -euo pipefail
        cd "$CHECKOUT_PATH"
        wget https://github.com/MangoIV/cabal-audit/releases/download/nightly/cabal-audit
        chmod +x cabal-audit
        if [[ "$ENRICH_SARIF" == "true" ]]; then
          cabal update
          cabal install cabal-plan-submit \
            --installdir "$RUNNER_TEMP/bin" \
            --overwrite-policy=always
        fi
    - name: Run Haskell Security Action
      shell: bash
      env:
        CHECKOUT_PATH: ${{ inputs.checkout_path }}
        ENRICH_SARIF: ${{ inputs.enrich-sarif }}
      run: |
        set -euo pipefail
        cd "$CHECKOUT_PATH"
        ./cabal-audit --sarif --to-file cabal-audit.sarif
        if [[ "$ENRICH_SARIF" == "true" ]]; then
          cabal build all --dry-run
          if [[ ! -f dist-newstyle/cache/plan.json ]]; then
            echo "Expected dist-newstyle/cache/plan.json after cabal build all --dry-run"
            exit 1
          fi
          "$RUNNER_TEMP/bin/cabal-plan-submit" enrich-sarif \
            dist-newstyle/cache/plan.json \
            cabal-audit.sarif \
            > results.sarif
        else
          cp cabal-audit.sarif results.sarif
        fi
        cat results.sarif
    - name: Upload SARIF file
      id: upload-sarif
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.checkout_path }}/results.sarif
        category: haskell-security-action
        checkout_path: ${{ inputs.checkout_path }}
        ref: ${{ inputs.ref }}
        sha: ${{ inputs.sha }}
        token: ${{ inputs.token }}

branding:
  icon: "search"
  color: "purple"
